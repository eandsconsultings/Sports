name: Update Playlist
on:
  push:
    paths:
      - 'freetv-us-103-numeric-servers.csv'
      - 'generate.py'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate playlists
        run: python generate.py --epg
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u channels.json epg.xml playlists/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update playlists + EPG [skip ci]"
          git push